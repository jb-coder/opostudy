name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  secrets-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Escanear historial
        run: gitleaks git --redact --no-banner -v .

  backend:
    name: Build y tests backend
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OpoStudy.Backend.slnf
      - name: Build
        run: dotnet build OpoStudy.Backend.slnf --no-restore -c Release
      - name: Tests
        run: dotnet test --solution OpoStudy.Backend.slnf --no-build -c Release

  mobile-android:
    name: Build app Android
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android
      - name: Build (Debug, sin firmar)
        run: dotnet build src/OpoStudy.Mobile/OpoStudy.Mobile.csproj -f net10.0-android -c Debug
